# Edge proxy in front of the crawl4ai container.
# The live crawl4ai-edge service is not defined in this repository's compose
# file. Point that container at this file (or copy these directives) so a
# slow client cannot hold a worker for an hour and a 50 MB body cannot land.
#
# proxy_read_timeout sits just above the API wall-clock cap (limits.wall_clock_s
# is 300). client_max_body_size matches limits.max_body_bytes (10 MiB).

server {
    listen 80;
    server_name crawl4ai.grantgunner.org;

    client_max_body_size 10m;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    send_timeout 330s;

    location / {
        proxy_pass http://127.0.0.1:11235;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
