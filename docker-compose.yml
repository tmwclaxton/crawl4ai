# Shared configuration for all environments
x-base-config: &base-config
  ports:
    - "11235:11235"  # Gunicorn port
  env_file:
    # API keys (create from .llm.env.example); optional so a fresh clone runs.
    - path: .llm.env
      required: false
  environment:
    # Auth token passthrough from the host shell (overwrites .llm.env).
    - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
    # Faster pages, and Firecrawl only when the browser comes back empty.
    - CRAWL4AI_FIRECRAWL_FALLBACK=${CRAWL4AI_FIRECRAWL_FALLBACK:-false}
    - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
    - CRAWL4AI_PAGE_TIMEOUT_MS=${CRAWL4AI_PAGE_TIMEOUT_MS:-15000}
    # The same-host crawl pause is on. Set true only for a private batch job.
    - CRAWL4AI_DISABLE_RATE_LIMITER=${CRAWL4AI_DISABLE_RATE_LIMITER:-false}
    # Public origin used in the MCP OAuth discovery documents.
    - CRAWL4AI_PUBLIC_BASE_URL=${CRAWL4AI_PUBLIC_BASE_URL:-https://crawl4ai.grantgunner.org}
    # Deep crawling over the API (off unless set to true in the shell or .env).
    - CRAWL4AI_ALLOW_DEEP_CRAWL=${CRAWL4AI_ALLOW_DEEP_CRAWL:-false}
    # Talk to this stack's Redis by its service name. Never set this to "redis":
    # on a shared Docker network that name is ambiguous.
    - REDIS_HOST=crawl4ai_redis
    - REDIS_PASSWORD=${REDIS_PASSWORD:-local-dev-crawl4ai-redis}
    # Daily caps on paid fallbacks, per token. Negative means unlimited.
    - CRAWL4AI_DAILY_FIRECRAWL_CAP=${CRAWL4AI_DAILY_FIRECRAWL_CAP:-500}
    - CRAWL4AI_DAILY_PROXY_CAP=${CRAWL4AI_DAILY_PROXY_CAP:-1000}
    - CRAWL4AI_DAILY_NANOGPT_CAP=${CRAWL4AI_DAILY_NANOGPT_CAP:-5000}
    # Uncomment to set default environment variables (will overwrite .llm.env)
    # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # - GROQ_API_KEY=${GROQ_API_KEY:-}
    # - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    # - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    # - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # - LLM_PROVIDER=${LLM_PROVIDER:-}  # Optional: Override default provider (e.g., "anthropic/claude-3-opus")
  # Chromium needs shared memory but the host /dev/shm bind was a shared,
  # writable mount; use a private sized tmpfs instead.
  shm_size: "1gb"
  # Hard memory cap. deploy.resources.limits is not applied by every Compose
  # version, so mem_limit is set as well. With the browser pool recycle this
  # replaces the weekly `docker compose restart crawl4ai` cron: drop that cron
  # once this image is what production runs.
  mem_limit: 4g
  # Least privilege: drop all capabilities, forbid privilege escalation, cap PIDs.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Read-only root filesystem; only these paths are writable (tmpfs).
  read_only: true
  tmpfs:
    - /tmp
    - /var/lib/redis:uid=999,gid=999,mode=0700
    - /var/lib/crawl4ai/outputs:uid=999,gid=999,mode=0700
    - /home/appuser/.crawl4ai:uid=999,gid=999,mode=0700
    # Keep the baked Playwright browser under ~/.cache/ms-playwright visible.
    - /home/appuser/.cache/url_seeder:uid=999,gid=999,mode=0700
    - /home/appuser/.gunicorn:uid=999,gid=999,mode=0700
  # Shared page cache survives restarts. CRAWL4AI_PAGE_CACHE_TTL_HOURS and
  # CRAWL4AI_PAGE_CACHE_MAX_MB control how long and how much it keeps.
  volumes:
    - crawl4ai_page_cache:/var/lib/crawl4ai/cache
  deploy:
    resources:
      limits:
        memory: 4G
        # PID cap; expressed here (not as pids_limit) so the file stays valid
        # on Compose v5+, which rejects pids_limit alongside a limits block.
        pids: 512
      reservations:
        memory: 1G
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  user: "appuser"

services:
  crawl4ai:
    # 1. Default: Pull multi-platform test image from Docker Hub
    # 2. Override with local image via: IMAGE=local-test docker compose up
    image: ${IMAGE:-unclecode/crawl4ai:${TAG:-latest}}
    
    # Local build config (used with --build)
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_TYPE: ${INSTALL_TYPE:-default}
        ENABLE_GPU: ${ENABLE_GPU:-false}
        # docker compose build will not expand this itself; export GIT_SHA
        # from `git rev-parse HEAD` so /health reports the commit.
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      - crawl4ai_redis

    # Inherit shared config
    <<: *base-config

  # Dedicated Redis for this stack. The service name is the DNS name.
  # Do not add a network alias of "redis": crawl4ai is also attached to other
  # compose networks where a different Redis is already called redis, and
  # clients (including vidgaze, if it shares this network) will hit the wrong one.
  # Do not publish the port. Set REDIS_PASSWORD before any production up;
  # the default below is only so a local `docker compose up` can boot.
  crawl4ai_redis:
    image: redis:7.2.7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-local-dev-crawl4ai-redis}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --bind
      - 0.0.0.0
    restart: unless-stopped

volumes:
  crawl4ai_page_cache: